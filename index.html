<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blades of the Crown — House Escher Tactical Deck</title>
<style>
  :root {
    --obsidian: #0a080d;
    --panel: #130f1a;
    --panel-2: #1b1525;
    --plum: #3b174d;
    --plum-glow: #6d2891;
    --gold: #d4af37;
    --gold-bright: #f5d76e;
    --gold-dim: rgba(212, 175, 55, 0.25);
    --venom: #10b981;
    --venom-dim: rgba(16, 185, 129, 0.18);
    --crown: #eab308;
    --crown-dim: rgba(234, 179, 8, 0.18);
    --crimson: #ef4444;
    --amber: #f59e0b;
    --slate: #94a3b8;
    --text: #f8fafc;
    --muted: #a1a1aa;
    --border: rgba(212, 175, 55, 0.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top right, #231130 0%, var(--obsidian) 55%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Top Command Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(10, 8, 13, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-crest {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--gold);
    background: linear-gradient(135deg, var(--plum), #160c21);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.25);
  }
  .brand-title h1 {
    margin: 0;
    font-size: 16px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--gold-bright);
  }
  .brand-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .brand-sub span {
    color: var(--gold);
    font-weight: 700;
  }

  /* Round Counter & Controls */
  .controls-cluster {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .round-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(59, 23, 77, 0.75), rgba(19, 15, 26, 0.95));
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 5px 9px;
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.16);
  }
  .round-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold-bright);
    letter-spacing: 0.4px;
    padding: 0 4px;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-gold {
    background: linear-gradient(135deg, #d4af37, #a8821d);
    color: #0a080d;
    border-color: var(--gold-bright);
  }
  .btn-mini {
    padding: 4px 8px;
    font-size: 11px;
  }
  .nav-links {
    display: flex;
    gap: 6px;
  }
  .nav-links .btn.active-page {
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.16);
    color: var(--gold-bright);
  }

  /* Main Split Layout */
  .layout {
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 14px;
    padding: 14px;
    max-width: 1440px;
    margin: 0 auto;
  }
  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  /* Left Sidebar */
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: fit-content;
    position: sticky;
    top: 72px;
  }
  @media (max-width: 860px) {
    .sidebar { position: static; }
  }
  .filter-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .filter-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 6px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .filter-btn.active {
    background: rgba(212, 175, 55, 0.18);
    border-color: var(--gold);
    color: var(--gold-bright);
  }
  .roster-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .roster-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(27, 21, 37, 0.9), rgba(14, 11, 19, 0.95));
    border: 1px solid rgba(255,255,255,0.07);
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .roster-item.selected {
    border-color: var(--gold);
    box-shadow: 0 0 14px rgba(212, 175, 55, 0.22);
    background: linear-gradient(135deg, rgba(59, 23, 77, 0.55), rgba(19, 15, 26, 0.98));
  }
  .roster-item.status-done { opacity: 0.62; }
  .roster-item.status-unavailable { opacity: 0.42; filter: grayscale(0.75); }
  .thumb-wrap {
    width: 46px;
    height: 46px;
    border-radius: 9px;
    border: 1px solid var(--gold-dim);
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    background: linear-gradient(135deg, var(--plum), #0e0a14);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,8,13,0.55) 0%, transparent 55%);
    pointer-events: none;
  }
  .thumb-fallback {
    font-weight: 800;
    font-size: 13px;
    color: var(--gold);
  }
  .roster-meta {
    flex: 1;
    min-width: 0;
  }
  .roster-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .roster-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .squad-pill {
    font-size: 9px;
    font-weight: 800;
    padding: 2px 5px;
    border-radius: 5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .squad-crown { background: var(--crown-dim); color: var(--gold-bright); border: 1px solid rgba(234,179,8,0.4); }
  .squad-venom { background: var(--venom-dim); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
  .roster-role {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .roster-badges {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
  }
  .mini-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .st-ready { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
  .st-done { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
  .st-pinned { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
  .st-injured { background: rgba(239, 68, 68, 0.24); color: #fca5a5; }
  .st-unavailable { background: rgba(113, 113, 122, 0.25); color: #a1a1aa; }
  .xp-mini { background: rgba(212, 175, 55, 0.16); color: var(--gold-bright); }

  /* Center Fighter Card */
  .stage {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .fighter-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
  }
  .hero-banner {
    position: relative;
    padding: 18px;
    background: linear-gradient(135deg, rgba(59, 23, 77, 0.85) 0%, rgba(19, 15, 26, 0.98) 68%);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
  }
  .portrait-box {
    width: 126px;
    height: 126px;
    border-radius: 14px;
    border: 2px solid var(--gold);
    overflow: hidden;
    position: relative;
    cursor: zoom-in;
    flex-shrink: 0;
    background: linear-gradient(145deg, #2b103a, #0a080d);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
  }
  .portrait-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .portrait-box::after {
    content: "🔍 FULL ART";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 5px 0;
    text-align: center;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.7px;
    color: var(--gold-bright);
    background: linear-gradient(to top, rgba(10, 8, 13, 0.92), transparent);
  }
  .portrait-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: var(--gold);
  }
  .hero-info {
    flex: 1;
    min-width: 240px;
  }
  .hero-top-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .rating-tag {
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .hero-name {
    margin: 0;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ffffff;
  }
  .hero-role {
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    margin-top: 2px;
  }
  .hero-quote {
    margin: 8px 0 0;
    font-size: 12.5px;
    font-style: italic;
    color: #d4d4d8;
    line-height: 1.4;
  }

  /* Status & XP Action Strip */
  .action-strip {
    padding: 12px 18px;
    background: #0f0c15;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .status-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .st-btn {
    padding: 7px 11px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .st-btn.active[data-st="ready"] { background: rgba(16,185,129,0.24); border-color: #10b981; color: #6ee7b7; }
  .st-btn.active[data-st="done"] { background: rgba(148,163,184,0.24); border-color: #94a3b8; color: #f8fafc; }
  .st-btn.active[data-st="pinned"] { background: rgba(245,158,11,0.25); border-color: #f59e0b; color: #fcd34d; }
  .st-btn.active[data-st="injured"] { background: rgba(239,68,68,0.28); border-color: #ef4444; color: #fca5a5; }
  .st-btn.active[data-st="unavailable"] { background: rgba(113,113,122,0.32); border-color: #a1a1aa; color: #e4e4e7; }

  .xp-box {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--gold-dim);
    padding: 5px 10px;
    border-radius: 9px;
  }
  .xp-val {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold-bright);
    margin-right: 4px;
  }
  .xp-btn {
    background: rgba(212, 175, 55, 0.16);
    border: 1px solid var(--gold-dim);
    color: var(--gold-bright);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .xp-btn:active { transform: scale(0.95); }

  /* 12-Stat Necromunda Grid */
  .section {
    padding: 16px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .section:last-child { border-bottom: none; }
  .section-title {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    color: var(--gold);
    margin: 0 0 10px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 5px;
  }
  @media (max-width: 640px) {
    .stat-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .stat-cell {
    background: var(--panel-2);
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 8px;
    text-align: center;
    padding: 6px 2px;
  }
  .stat-lbl {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
  }
  .stat-num {
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    margin-top: 2px;
  }

  /* Weapons Table */
  .table-wrap {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    text-align: left;
    padding: 8px;
    background: rgba(59, 23, 77, 0.45);
    color: var(--gold-bright);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    vertical-align: top;
  }
  .wpn-name {
    font-weight: 800;
    color: #fff;
  }
  .trait-pill {
    display: inline-block;
    background: rgba(212, 175, 55, 0.14);
    border: 1px solid rgba(212, 175, 55, 0.32);
    color: var(--gold-bright);
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    margin: 2px 3px 2px 0;
  }
  .trait-toxin {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.45);
    color: #6ee7b7;
  }

  /* Info Cards Grid */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
  }
  .info-card {
    background: var(--panel-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px;
  }
  .info-card h4 {
    margin: 0 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--gold);
  }
  .info-card p {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: #e4e4e7;
  }
  .injury-alert {
    border-color: rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.08);
  }
  .injury-alert h4 { color: #fca5a5; }

  /* Full Portrait Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(6, 5, 9, 0.92);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox-inner {
    max-width: 520px;
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
  }
  .lightbox-head {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, var(--plum), var(--panel));
  }
  .lightbox-head h3 {
    margin: 0;
    font-size: 15px;
    color: var(--gold-bright);
  }
  .lightbox-body {
    background: #08060b;
    display: flex;
    align-items: center;
    justify-content: center;
    max-height: 75vh;
    overflow: hidden;
  }
  .lightbox-body img {
    width: 100%;
    height: auto;
    max-height: 75vh;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-crest">👑</div>
    <div class="brand-title">
      <h1>Blades of the Crown</h1>
      <div class="brand-sub" id="gangSummary">
        House Escher • Active: <span id="activeRating">1250 Cr</span> (<span id="activeCount">10</span>/10) • Stash: <span>150 Cr</span> • Rep: <span>4</span> • Gang XP: <span id="totalXp">27</span>
      </div>
    </div>
  </div>

  <div class="controls-cluster">
    <div class="round-box">
      <button class="btn btn-mini" id="prevRoundBtn" title="Previous Round">◀</button>
      <span class="round-label" id="roundDisplay">🎲 Round 1</span>
      <button class="btn btn-gold btn-mini" id="nextRoundBtn" title="Advance Round & Reset Activated Fighters">Next ▶</button>
      <button class="btn btn-mini" id="resetRoundBtn" title="Reset to Round 1">↺</button>
    </div>

    <button class="btn" id="newTurnBtn" title="Reset Activated fighters to Ready">↺ New Turn</button>
    <button class="btn" id="syncXpBtn" title="Reset XP to Munda Manager baseline">↺ Sync XP</button>

    <nav class="nav-links">
      <a class="btn active-page" href="index.html">⚔️ Deck</a>
      <a class="btn" href="bible.html">📖 Bible</a>
      <a class="btn" href="campaign.html">🗺️ Campaign</a>
    </nav>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All (10)</button>
      <button class="filter-btn" data-filter="crown">👑 Crown</button>
      <button class="filter-btn" data-filter="venom">🐍 Venom</button>
    </div>
    <div class="roster-list" id="rosterList"></div>
  </aside>

  <section class="stage" id="fighterStage"></section>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-head">
      <h3 id="lightboxTitle">Fighter Portrait</h3>
      <button class="btn btn-mini" id="closeLightboxBtn">✕ Close</button>
    </div>
    <div class="lightbox-body">
      <img id="lightboxImg" src="" alt="Full Fighter Portrait">
    </div>
  </div>
</div>

const STATE_KEY = "blades_crown_deck_v10";
let state = {
  selectedId: "hermajesty",
  filter: "all",
  round: 1,
  statuses: {},
  xp: {}
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY));
    if (saved) state = { ...state, ...saved };
  } catch (e) {}
  FIGHTERS.forEach(f => {
    if (!state.statuses[f.id]) state.statuses[f.id] = "ready";
    if (typeof state.xp[f.id] !== "number") state.xp[f.id] = f.baseXp;
  });
}

function saveState() {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
}

function buildCandidates(baseName) {
  const cap = baseName.charAt(0).toUpperCase() + baseName.slice(1);
  const upper = baseName.toUpperCase();
  const folders = ["images/", "Images/"];
  const names = [baseName, cap, upper];
  const exts = [".jpg", ".jpeg", ".png", ".webp", ".JPG", ".JPEG", ".PNG"];
  const list = [];
  folders.forEach(dir => {
    names.forEach(n => {
      exts.forEach(ext => list.push(dir + n + ext));
    });
  });
  return list;
}

function loadSmartImage(imgEl, candidates, onFound, onFail) {
  let idx = 0;
  function tryNext() {
    if (idx >= candidates.length) {
      if (onFail) onFail();
      return;
    }
    const src = candidates[idx++];
    const tester = new Image();
    tester.onload = () => {
      imgEl.src = src;
      if (onFound) onFound(src);
    };
    tester.onerror = tryNext;
    tester.src = src;
  }
  tryNext();
}

function updateSummary() {
  let activeRating = 0;
  let activeCount = 0;
  let totalXp = 0;
  FIGHTERS.forEach(f => {
    const st = state.statuses[f.id] || "ready";
    if (st !== "unavailable") {
      activeRating += f.rating;
      activeCount += 1;
    }
    totalXp += (state.xp[f.id] ?? f.baseXp);
  });
  document.getElementById("activeRating").textContent = activeRating + " Cr";
  document.getElementById("activeCount").textContent = activeCount;
  document.getElementById("totalXp").textContent = totalXp;
  document.getElementById("roundDisplay").textContent = "🎲 Round " + state.round;
}

const statusLabels = {
  ready: "Ready",
  done: "Activated",
  pinned: "Pinned",
  injured: "Ser. Injured",
  unavailable: "Unavailable"
};

function renderSidebar() {
  const listEl = document.getElementById("rosterList");
  listEl.innerHTML = "";
  FIGHTERS.filter(f => state.filter === "all" || f.squad === state.filter).forEach(f => {
    const st = state.statuses[f.id] || "ready";
    const xpVal = state.xp[f.id] ?? f.baseXp;
    const item = document.createElement("div");
    item.className = `roster-item ${state.selectedId === f.id ? "selected" : ""} status-${st}`;
    item.onclick = () => {
      state.selectedId = f.id;
      saveState();
      renderAll();
    };

    const initials = f.name.split(" ").map(w => w[0]).join("").slice(0, 2);
    item.innerHTML = `
      <div class="thumb-wrap">
        <span class="thumb-fallback">${initials}</span>
        <img alt="${f.name}" style="display:none;">
      </div>
      <div class="roster-meta">
        <div class="roster-name-row">
          <span class="roster-name">#${f.num} ${f.name}</span>
          <span class="squad-pill ${f.squad === "crown" ? "squad-crown" : "squad-venom"}">
            ${f.squad === "crown" ? "👑 Crown" : "🐍 Venom"}
          </span>
        </div>
        <div class="roster-role">${f.role} • ${f.rating} Cr</div>
        <div class="roster-badges">
          <span class="mini-badge st-${st}">${statusLabels[st]}</span>
          <span class="mini-badge xp-mini">⭐ ${xpVal} XP</span>
        </div>
      </div>
    `;

    const imgEl = item.querySelector("img");
    const fbEl = item.querySelector(".thumb-fallback");
    const sqCandidates = [...buildCandidates(f.id + "square"), ...buildCandidates(f.id)];
    loadSmartImage(imgEl, sqCandidates, () => {
      fbEl.style.display = "none";
      imgEl.style.display = "block";
    });

    listEl.appendChild(item);
  });
}

                  <td>${w.d}</td>
                  <td>${w.am}</td>
                  <td>${w.traits.map(t => `<span class="trait-pill ${t.toLowerCase().includes("toxin") ? "trait-toxin" : ""}">${t}</span>`).join("")}</td>

  stage.querySelectorAll(".xp-btn").forEach(btn => {
    btn.onclick = () => {
      const delta = parseInt(btn.dataset.dxp, 10);
      state.xp[f.id] = Math.max(0, (state.xp[f.id] ?? f.baseXp) + delta);
      saveState();
      renderAll();
    };

  const heroImg = document.getElementById("heroPortraitImg");
  const fbEl = stage.querySelector(".portrait-fallback");
  const sqCandidates = [...buildCandidates(f.id + "square"), ...buildCandidates(f.id)];

function openLightbox(f) {
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightboxImg");
  document.getElementById("lightboxTitle").textContent = `${f.name} — ${f.role}`;
  lbImg.src = "";
  lb.classList.add("open");
  const fullCandidates = [...buildCandidates(f.id), ...buildCandidates(f.id + "square")];
  loadSmartImage(lbImg, fullCandidates);
}

function renderAll() {
  updateSummary();
  renderSidebar();
  renderStage();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.filter;
    saveState();
    renderSidebar();
  };
});

document.getElementById("nextRoundBtn").onclick = () => {
  state.round += 1;
  FIGHTERS.forEach(f => {
    if (state.statuses[f.id] === "done") state.statuses[f.id] = "ready";
  });
  saveState();
  renderAll();
};

document.getElementById("prevRoundBtn").onclick = () => {
  state.round = Math.max(1, state.round - 1);
  saveState();
  updateSummary();
};

document.getElementById("resetRoundBtn").onclick = () => {
  state.round = 1;
  saveState();
  updateSummary();
};

document.getElementById("newTurnBtn").onclick = () => {
  FIGHTERS.forEach(f => {
    if (state.statuses[f.id] === "done") state.statuses[f.id] = "ready";
  });
  saveState();
  renderAll();
};

document.getElementById("syncXpBtn").onclick = () => {
  FIGHTERS.forEach(f => { state.xp[f.id] = f.baseXp; });
  saveState();
  renderAll();
};

document.getElementById("closeLightboxBtn").onclick = () => {
  document.getElementById("lightbox").classList.remove("open");
};
document.getElementById("lightbox").onclick = (e) => {
  if (e.target.id === "lightbox") document.getElementById("lightbox").classList.remove("open");
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") document.getElementById("lightbox").classList.remove("open");
});

loadState();
renderAll();
