<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Blades of the Crown — Live Tactical Deck</title>
<style>
  :root {
    --bg: #0b090e;
    --panel: #14101a;
    --panel2: #1c1624;
    --plum: #3b1742;
    --plum-bright: #6b2478;
    --gold: #d4af37;
    --gold-dim: #8f7322;
    --crimson: #c93b4b;
    --emerald: #34a875;
    --cyan: #3da5d9;
    --amber: #e08e36;
    --slate: #6e6878;
    --text: #efe9f4;
    --muted: #a699b3;
    --border: rgba(212, 175, 55, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top right, #1f1126 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    padding-bottom: 40px;
  }
  a { text-decoration: none; color: inherit; }

  /* Sticky Top Command Bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11, 9, 14, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .crest {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--gold);
    background: var(--plum);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--gold); font-size: 13px;
  }
  .crest img { width: 100%; height: 100%; object-fit: cover; }
  .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 0.6px; color: var(--gold); text-transform: uppercase; }
  .brand-sub { font-size: 11px; color: var(--muted); }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 7px 12px; border-radius: 7px; font-size: 12px; font-weight: 700;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    cursor: pointer; transition: 0.15s;
  }
  .btn:hover, .btn.active-page { border-color: var(--gold); color: var(--gold); }
  .btn-reset { border-color: rgba(201, 59, 75, 0.45); color: #ff9aa5; }
  .btn-reset:hover { border-color: var(--crimson); background: rgba(201, 59, 75, 0.16); }

  /* Split-Deck Layout */
  .deck-wrap {
    max-width: 1200px;
    margin: 14px auto 0;
    padding: 0 14px;
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .deck-wrap { grid-template-columns: 1fr; }
  }

  /* Left Sidebar */
  .sidebar {
    position: sticky;
    top: 66px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  @media (max-width: 820px) {
    .sidebar { position: static; }
  }
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px;
  }
  .f-pill {
    padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; transition: 0.15s;
  }
  .f-pill:hover { color: var(--text); }
  .f-pill.active {
    background: linear-gradient(135deg, var(--plum), #261430);
    border-color: var(--gold); color: var(--gold);
  }
  .roster-list {
    display: flex; flex-direction: column; gap: 7px;
    max-height: calc(100vh - 155px);
    overflow-y: auto;
    padding-right: 2px;
  }
  @media (max-width: 820px) {
    .roster-list { max-height: none; }
  }

  .nav-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 9px; border-radius: 9px;
    background: var(--panel2);
    border: 1px solid var(--border);
    cursor: pointer; transition: 0.15s;
    text-align: left;
    position: relative;
  }
  .nav-card:hover { border-color: var(--gold-dim); }
  .nav-card.selected {
    background: linear-gradient(135deg, rgba(59, 23, 66, 0.85), rgba(28, 22, 36, 0.98));
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.18);
  }
  .nav-card.is-unavailable {
    opacity: 0.45;
    filter: grayscale(0.75);
  }
  .nav-thumb {
    width: 44px; height: 44px; border-radius: 7px; flex-shrink: 0;
    border: 1.5px solid var(--gold-dim);
    background: var(--plum);
    overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: var(--gold);
  }
  .nav-thumb img {
    width: 100%; height: 100%; object-fit: cover; object-position: center top;
  }
  .nav-info { flex: 1; min-width: 0; }
  .nav-name {
    font-size: 13.5px; font-weight: 800; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nav-role {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .squad-tag {
    display: inline-block; font-size: 9.5px; font-weight: 800;
    padding: 1px 5px; border-radius: 4px; text-transform: uppercase;
    margin-right: 4px;
  }
  .sq-crown { background: rgba(212, 175, 55, 0.18); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.4); }
  .sq-venom { background: rgba(52, 168, 117, 0.18); color: #7ce8b5; border: 1px solid rgba(52, 168, 117, 0.4); }

  .status-dot {
    font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px;
    text-transform: uppercase; flex-shrink: 0;
  }
  .st-ready { background: rgba(52, 168, 117, 0.2); color: #7ce8b5; border: 1px solid rgba(52, 168, 117, 0.45); }
  .st-activated { background: rgba(61, 165, 217, 0.2); color: #8ad4f7; border: 1px solid rgba(61, 165, 217, 0.45); }
  .st-pinned { background: rgba(224, 142, 54, 0.22); color: #ffc078; border: 1px solid rgba(224, 142, 54, 0.45); }
  .st-injured { background: rgba(201, 59, 75, 0.22); color: #ff8c99; border: 1px solid rgba(201, 59, 75, 0.45); }
  .st-unavailable { background: rgba(110, 104, 120, 0.25); color: #c4becd; border: 1px solid rgba(110, 104, 120, 0.5); }

  /* Centre Stage Fighter Sheet */
  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .stage.stage-unavailable {
    border-color: rgba(110, 104, 120, 0.45);
  }
  .unavail-banner {
    background: rgba(201, 59, 75, 0.16);
    border: 1px solid rgba(201, 59, 75, 0.45);
    color: #ffb3bc;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .hero-row {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .portrait-box {
    width: 112px; height: 112px; border-radius: 12px; flex-shrink: 0;
    border: 2px solid var(--gold);
    background: linear-gradient(135deg, var(--plum), #1c1624);
    overflow: hidden; position: relative;
    cursor: zoom-in;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
  }
  .portrait-box img {
    width: 100%; height: 100%; object-fit: cover; object-position: center top;
    transition: transform 0.2s;
  }
  .portrait-box:hover img { transform: scale(1.04); }
  .portrait-box::after {
    content: "🔍 Full"; position: absolute; bottom: 5px; right: 5px;
    background: rgba(11, 9, 14, 0.82); color: var(--gold);
    font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border);
  }
  .hero-meta { flex: 1; min-width: 220px; }
  .hero-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 5px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--gold);
  }
  .badge-venom { color: #7ce8b5; border-color: rgba(52, 168, 117, 0.45); background: rgba(52, 168, 117, 0.14); }
  .badge-crown { color: var(--gold); border-color: rgba(212, 175, 55, 0.45); background: rgba(212, 175, 55, 0.14); }
  .hero-name { font-size: 24px; font-weight: 900; color: #fff; line-height: 1.15; }
  .hero-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* Live Status Toggle Strip */
  .status-strip {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .st-btn {
    padding: 5px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 700;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; transition: 0.15s;
  }
  .st-btn:hover { color: #fff; }
  .st-btn.on-ready { background: rgba(52, 168, 117, 0.24); border-color: var(--emerald); color: #8ff0c2; }
  .st-btn.on-activated { background: rgba(61, 165, 217, 0.24); border-color: var(--cyan); color: #9ce0ff; }
  .st-btn.on-pinned { background: rgba(224, 142, 54, 0.24); border-color: var(--amber); color: #ffd094; }
  .st-btn.on-injured { background: rgba(201, 59, 75, 0.24); border-color: var(--crimson); color: #ff9ea9; }
  .st-btn.on-unavailable { background: rgba(110, 104, 120, 0.35); border-color: #b4adc0; color: #fff; }

  /* 12-Stat Bar */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }
  @media (max-width: 640px) {
    .stat-grid { grid-template-columns: repeat(6, 1fr); }
  }
  .stat-cell {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 7px;
    text-align: center;
    padding: 6px 2px;
  }
  .stat-lbl { font-size: 10px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
  .stat-val { font-size: 14px; font-weight: 900; color: #fff; margin-top: 2px; }

  /* Weapons Table */
  .sec-title {
    font-size: 13.5px; font-weight: 800; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 14px 0 8px;
  }
  .table-wrap { overflow-x: auto; margin-bottom: 14px; }
  table {
    width: 100%; border-collapse: collapse; font-size: 12px;
    background: var(--panel2); border-radius: 8px; overflow: hidden;
  }
  th {
    background: rgba(59, 23, 66, 0.65); color: var(--gold);
    font-weight: 800; text-align: center; padding: 7px 6px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; padding-left: 10px; }
  td {
    padding: 8px 6px; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: #eae3f2;
  }
  .trait-pill {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    padding: 1px 6px; border-radius: 4px; margin: 1px 2px;
    background: rgba(212, 175, 55, 0.14); color: #f5d87a;
    border: 1px solid rgba(212, 175, 55, 0.3);
  }
  .trait-toxin {
    background: rgba(52, 168, 117, 0.2); color: #82f0bd;
    border-color: rgba(52, 168, 117, 0.45);
  }

  /* Info Boxes */
  .info-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px; margin-bottom: 12px;
  }
  .info-box {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
  }
  .info-box strong { color: var(--gold); }
  .injury-box {
    background: rgba(201, 59, 75, 0.14);
    border: 1px solid rgba(201, 59, 75, 0.4);
    color: #ffc2c9;
  }
  .tactic-box {
    background: rgba(59, 23, 66, 0.32);
    border-left: 3px solid var(--gold);
    padding: 10px 12px; border-radius: 7px; font-size: 12.5px;
    margin-bottom: 10px;
  }

  /* Lightbox Modal */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(5, 4, 8, 0.9);
    backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 18px;
  }
  .lightbox.open { display: flex; }
  .lb-card {
    max-width: 480px; width: 100%;
    background: var(--panel);
    border: 1.5px solid var(--gold);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.75);
  }
  .lb-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: rgba(59, 23, 66, 0.6);
    border-bottom: 1px solid var(--border);
  }
  .lb-title { font-size: 14px; font-weight: 800; color: var(--gold); }
  .lb-close {
    background: var(--panel2); border: 1px solid var(--border);
    color: #fff; font-size: 12px; font-weight: 800;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .lb-img-wrap {
    background: #09070c;
    display: flex; align-items: center; justify-content: center;
    max-height: 75vh; overflow: hidden;
  }
  .lb-img-wrap img {
    width: 100%; height: auto; max-height: 75vh; object-fit: contain;
  }
</style>
</head>

let selectedId = 'hermajesty';
let currentFilter = 'all';
const resolvedSquareUrl = {};
const resolvedFullUrl = {};

function buildCandidates(baseName) {
  const title = baseName.charAt(0).toUpperCase() + baseName.slice(1);
  const upper = baseName.toUpperCase();
  const folders = ['images', 'Images'];
  const names = [baseName, title, upper];
  const exts = ['jpg', 'jpeg', 'png', 'webp', 'JPG', 'JPEG', 'PNG'];
  const list = [];
  folders.forEach(f => names.forEach(n => exts.forEach(e => list.push(`${f}/${n}.${e}`))));
  return list;
}

function loadSmartImage(imgEl, primaryBase, fallbackBase, cacheKey, cacheStore, onFail) {
  if (cacheStore && cacheStore[cacheKey]) {
    imgEl.src = cacheStore[cacheKey];
    return;
  }
  const candidates = buildCandidates(primaryBase);
  if (fallbackBase) candidates.push(...buildCandidates(fallbackBase));
  let idx = 0;
  imgEl.onload = () => {
    if (cacheStore) cacheStore[cacheKey] = imgEl.src;
  };
  imgEl.onerror = () => {
    idx++;
    if (idx < candidates.length) {
      imgEl.src = candidates[idx];
    } else if (onFail) {
      onFail();
    }
  };
  imgEl.src = candidates[0];
}

// Load Gang Crest
(function loadCrest() {
  const box = document.getElementById('crestBox');
  const img = document.createElement('img');
  img.alt = 'Blades of the Crown';
  loadSmartImage(img, 'gangcrest', null, 'gangcrest', resolvedFullUrl, () => {});
  img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
})();

function updateHeaderSummary() {
  const activeCount = FIGHTERS.filter(f => f.status !== 'unavailable').length;
  const unavailCount = FIGHTERS.length - activeCount;
  const activeRating = FIGHTERS.filter(f => f.status !== 'unavailable').reduce((s, f) => s + f.rating, 0);
  document.getElementById('gangSummary').textContent =
    `House Escher • Deployed: ${activeRating} Cr (${activeCount} Active${unavailCount ? `, ${unavailCount} Unavailable` : ''})`;
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.f-pill').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('rosterList');
  list.innerHTML = '';
  const filtered = FIGHTERS.filter(f => {
    if (currentFilter === 'crown') return f.squad === 'crown';
    if (currentFilter === 'venom') return f.squad === 'venom';
    if (currentFilter === 'available') return f.status !== 'unavailable';
    return true;
  });

  filtered.forEach(f => {
    const card = document.createElement('div');
    card.className = `nav-card${f.id === selectedId ? ' selected' : ''}${f.status === 'unavailable' ? ' is-unavailable' : ''}`;
    card.onclick = () => { selectedId = f.id; renderSidebar(); renderStage(); };

    const thumb = document.createElement('div');
    thumb.className = 'nav-thumb';
    thumb.textContent = f.name.slice(0, 2).toUpperCase();
    const img = document.createElement('img');
    img.alt = f.name;
    loadSmartImage(img, `${f.id}square`, f.id, f.id, resolvedSquareUrl, () => { img.remove(); });
    img.onload = () => {
      resolvedSquareUrl[f.id] = img.src;
      thumb.innerHTML = '';
      thumb.appendChild(img);
    };

    const info = document.createElement('div');
    info.className = 'nav-info';
    const sqClass = f.squad === 'crown' ? 'sq-crown' : 'sq-venom';
    info.innerHTML = `
      <div class="nav-name">${f.name}</div>
      <div class="nav-role"><span class="squad-tag ${sqClass}">${f.squad === 'crown' ? 'Crown' : 'Venom'}</span>${f.rank.split('•')[0].trim()} • ${f.rating} Cr</div>
    `;

    const stMap = {
      ready: ['st-ready', 'Ready'],
      activated: ['st-activated', 'Done'],
      pinned: ['st-pinned', 'Pinned'],
      injured: ['st-injured', 'Injured'],
      unavailable: ['st-unavailable', 'Out']
    };
    const [stCls, stTxt] = stMap[f.status] || stMap.ready;
    const dot = document.createElement('span');
    dot.className = `status-dot ${stCls}`;
    dot.textContent = stTxt;

    card.appendChild(thumb);
    card.appendChild(info);
    card.appendChild(dot);
    list.appendChild(card);
  });
}

function setStatus(id, newStatus) {
  const f = FIGHTERS.find(x => x.id === id);
  if (!f) return;
  f.status = newStatus;
  updateHeaderSummary();
  renderSidebar();
  renderStage();
}

function resetTurn() {
  FIGHTERS.forEach(f => {
    if (f.status === 'activated' || f.status === 'pinned') {
      f.status = 'ready';
    }
  });
  updateHeaderSummary();
  renderSidebar();
  renderStage();
}

function renderStage() {
  const f = FIGHTERS.find(x => x.id === selectedId) || FIGHTERS[0];

    <div class="stat-cell">
      <div class="stat-lbl">${k}</div>
      <div class="stat-val">${f.stats[k]}</div>

  const weaponsHtml = f.weapons.map(w => {
    const traitsHtml = w.traits.map(t => {
      const isTox = t.toLowerCase().includes('toxin');

    return `
      <tr>
        <td><strong>${w.name}</strong></td>
        <td>${w.rngS}</td>
        <td>${w.rngL}</td>
        <td>${w.accS}</td>
        <td>${w.accL}</td>
        <td>${w.str}</td>
        <td>${w.ap}</td>
        <td>${w.d}</td>
        <td>${w.am}</td>
        <td style="text-align:left;">${traitsHtml}</td>
      </tr>
    `;
  }).join('');

  const sqBadgeClass = f.squad === 'crown' ? 'badge-crown' : 'badge-venom';
  const sqIcon = f.squad === 'crown' ? '👑' : '🐍';

  stage.innerHTML = `
    ${f.status === 'unavailable' ? `
      <div class="unavail-banner">
        <span>⛔ ${f.name} is marked UNAVAILABLE for this game (excluded from active deployment).</span>
        <button class="btn" onclick="setStatus('${f.id}', 'ready')">Restore to Active</button>
      </div>
    ` : ''}

    <div class="hero-row">
      <div class="portrait-box" id="stagePortrait" title="Click to view full portrait" onclick="openFullPortrait('${f.id}', '${f.name}')">
        <span style="font-size:28px;font-weight:900;color:var(--gold);">${f.name.slice(0,2).toUpperCase()}</span>
      </div>
      <div class="hero-meta">
        <div class="hero-badges">
          <span class="badge ${sqBadgeClass}">${sqIcon} ${f.squadLabel}</span>
          <span class="badge">Rating: ${f.rating} Cr</span>
          ${f.skills !== 'None' ? `<span class="badge">Skill: ${f.skills}</span>` : ''}
        </div>
        <div class="hero-name">${f.name}</div>
        <div class="hero-sub">${f.rank}</div>

        <div class="status-strip">
          <button class="st-btn ${f.status === 'ready' ? 'on-ready' : ''}" onclick="setStatus('${f.id}', 'ready')">✅ Ready</button>
          <button class="st-btn ${f.status === 'activated' ? 'on-activated' : ''}" onclick="setStatus('${f.id}', 'activated')">⚡ Activated</button>
          <button class="st-btn ${f.status === 'pinned' ? 'on-pinned' : ''}" onclick="setStatus('${f.id}', 'pinned')">⬇️ Pinned</button>
          <button class="st-btn ${f.status === 'injured' ? 'on-injured' : ''}" onclick="setStatus('${f.id}', 'injured')">🩸 Ser. Injured</button>
          <button class="st-btn ${f.status === 'unavailable' ? 'on-unavailable' : ''}" onclick="setStatus('${f.id}', 'unavailable')">⛔ Unavailable</button>
        </div>
      </div>
    </div>

    <div class="stat-grid">${statsHtml}</div>

    <div class="sec-title">Weapons &amp; Profiles</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Weapon</th>
            <th>Rng S</th>
            <th>Rng L</th>
            <th>Acc S</th>
            <th>Acc L</th>
            <th>Str</th>
            <th>AP</th>
            <th>D</th>
            <th>Am</th>
            <th style="text-align:left;">Traits</th>
          </tr>
        </thead>
        <tbody>${weaponsHtml}</tbody>
      </table>
    </div>

    <div class="info-grid">
      <div class="info-box"><strong>Wargear:</strong> ${f.wargear}</div>
      <div class="info-box"><strong>Special Rules:</strong> ${f.rules}</div>
      ${f.injury !== 'None' ? `<div class="info-box injury-box"><strong>Lasting Injury:</strong> ${f.injury}</div>` : ''}
    </div>

    <div class="tactic-box">
      <strong style="color:var(--gold);">Vertical Playbook Role:</strong> ${f.tactic}
    </div>
  `;

  // Populate Square Portrait
  const pBox = document.getElementById('stagePortrait');
  const pImg = document.createElement('img');
  pImg.alt = f.name;
  loadSmartImage(pImg, `${f.id}square`, f.id, f.id, resolvedSquareUrl, () => {});
  pImg.onload = () => {
    resolvedSquareUrl[f.id] = pImg.src;
    pBox.innerHTML = '';
    pBox.appendChild(pImg);
  };
}

function openFullPortrait(id, name) {
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  document.getElementById('lbTitle').textContent = `${name} — Full Portrait`;
  lb.classList.add('open');
  loadSmartImage(lbImg, id, `${id}square`, id, resolvedFullUrl, () => {});
}

function closeLightbox(e) {
  if (!e || e.target.id === 'lightbox') {
    document.getElementById('lightbox').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

updateHeaderSummary();
renderSidebar();
renderStage();
