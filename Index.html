<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blades of the Crown — iPad Mini Deck v7</title>
<style>
  :root {
    --bg-obsidian: #0a080d;
    --bg-panel: #130f1a;
    --bg-card: #1b1524;
    --bg-card-hover: #241b30;
    --plum-deep: #2c1338;
    --plum-accent: #5e2778;
    --gold-auric: #d4af37;
    --gold-bright: #f3d266;
    --gold-dim: #8a6d1f;
    --crimson-venom: #b82946;
    --teal-chem: #2ab7a9;
    --text-main: #f2eef7;
    --text-muted: #a69bb5;
    --border-subtle: rgba(212, 175, 55, 0.22);
    --border-strong: rgba(212, 175, 55, 0.55);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-obsidian);
    color: var(--text-main);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top Command Bar */
  header.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: linear-gradient(90deg, #160c1f 0%, #24112f 50%, #140b1c 100%);
    border-bottom: 1px solid var(--border-strong);
    flex-shrink: 0;
    gap: 10px;
  }

  .brand-cluster {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .crest-badge {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-auric);
    background: radial-gradient(circle, var(--plum-accent), var(--bg-obsidian));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--gold-bright);
    font-size: 13px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .crest-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .title-block h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-bright);
    line-height: 1.1;
  }

  .title-block span {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid var(--border-strong);
    color: var(--gold-bright);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn:hover, .btn:active {
    background: rgba(212, 175, 55, 0.25);
    border-color: var(--gold-bright);
  }

  .btn-bible {
    background: linear-gradient(135deg, rgba(94, 39, 120, 0.55), rgba(212, 175, 55, 0.22));
    border-color: var(--gold-auric);
    color: #fff;
  }

  /* Main Split Workspace */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left Roster Rail */
  aside.roster-rail {
    width: 225px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .squad-tabs {
    display: flex;
    border-bottom: 1px solid var(--border-subtle);
    padding: 6px;
    gap: 4px;
  }

  .squad-tab {
    flex: 1;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 4px;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .squad-tab.active {
    background: var(--plum-deep);
    border-color: var(--gold-auric);
    color: var(--gold-bright);
  }

  .fighter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .nav-card {
    position: relative;
    height: 64px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    padding: 7px 9px;
    transition: transform 0.12s ease, border-color 0.15s ease;
  }

  .nav-card:hover {
    border-color: var(--gold-auric);
  }

  .nav-card.active {
    border: 1.5px solid var(--gold-bright);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
  }

  .nav-card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 20%;
    opacity: 0.72;
    transition: opacity 0.2s ease;
  }

  .nav-card-vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(10, 8, 13, 0.94) 0%, rgba(19, 15, 26, 0.72) 55%, rgba(44, 19, 56, 0.28) 100%),
                linear-gradient(0deg, rgba(10, 8, 13, 0.92) 0%, transparent 65%);
  }

  .nav-card-info {
    position: relative;
    z-index: 2;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .nav-name {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    line-height: 1.15;
  }

  .nav-role {
    font-size: 10px;
    color: var(--gold-auric);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .nav-pts {
    font-size: 11px;
    font-weight: 700;
    color: var(--gold-bright);
    background: rgba(10, 8, 13, 0.75);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
  }

  /* Main Fighter Dossier */
  main.dossier {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Hero Banner with Masked Gradient Art */
  .hero-banner {
    position: relative;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: linear-gradient(135deg, #1b1126 0%, #2a1336 60%, #140d1c 100%);
    padding: 14px 16px;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 118px;
  }

  .hero-art-wash {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 52%;
    background-size: cover;
    background-position: center 18%;
    opacity: 0.65;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.85) 45%, #000 100%);
    mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.85) 45%, #000 100%);
    pointer-events: none;
  }

  .hero-gradient-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(16, 11, 22, 0.96) 0%, rgba(27, 17, 38, 0.78) 52%, rgba(44, 19, 56, 0.25) 100%),
                linear-gradient(0deg, rgba(10, 8, 13, 0.85) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 68%;
  }

  .hero-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-auric);
    margin-bottom: 3px;
  }

  .hero-title {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .hero-sub {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.35;
  }

  .hero-controls {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .credits-pill {
    background: rgba(10, 8, 13, 0.82);
    border: 1px solid var(--gold-auric);
    color: var(--gold-bright);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
  }

  /* Stat Strip (Top Trumps Interactive) */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
  }

  .stat-cell {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 7px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .stat-cell:hover, .stat-cell.called {
    background: var(--plum-deep);
    border-color: var(--gold-bright);
    transform: translateY(-2px);
  }

  .stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--gold-auric);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .stat-val {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
  }

  /* Section Cards */
  .section-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.14);
  }

  .section-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold-bright);
  }

  /* Weapons Table */
  table.weapons-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  table.weapons-table th {
    text-align: left;
    color: var(--gold-auric);
    font-size: 10px;
    text-transform: uppercase;
    padding: 5px 6px;
    border-bottom: 1px solid var(--border-subtle);
  }

  table.weapons-table td {
    padding: 7px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: var(--text-main);
  }

  .trait-tag {
    display: inline-block;
    background: rgba(94, 39, 120, 0.45);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: var(--gold-bright);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 4px;
  }

  /* Two-Column Grid for Gear & Notes */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .gear-chip {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-main);
  }

  textarea.notes-box {
    width: 100%;
    min-height: 76px;
    background: var(--bg-obsidian);
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    color: var(--text-main);
    padding: 8px;
    font-size: 12px;
    resize: vertical;
    font-family: inherit;
  }

  textarea.notes-box:focus {
    outline: none;
    border-color: var(--gold-auric);
  }

  /* Card Art Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 4, 8, 0.86);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .trump-modal {
    width: 340px;
    max-width: 100%;
    background: var(--bg-panel);
    border: 2px solid var(--gold-auric);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 45px rgba(0,0,0,0.8);
  }

  .trump-art-frame {
    position: relative;
    height: 330px;
    background: radial-gradient(circle at top, var(--plum-accent), var(--bg-obsidian));
    display: flex;
    align-items: flex-end;
    padding: 14px;
  }

  .trump-art-frame img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
  }

  .trump-art-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(10, 8, 13, 0.96) 0%, rgba(19, 15, 26, 0.45) 45%, rgba(44, 19, 56, 0.25) 100%);
  }

  .trump-caption {
    position: relative;
    z-index: 2;
  }

  .trump-caption h3 {
    font-size: 20px;
    color: var(--gold-bright);
  }

  .trump-caption p {
    font-size: 12px;
    color: var(--text-muted);
  }

  .modal-footer {
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--bg-obsidian);
  }

  @media (max-width: 760px) {
    .workspace { flex-direction: column; }
    aside.roster-rail { width: 100%; height: 126px; border-right: none; border-bottom: 1px solid var(--border-subtle); }
    .fighter-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .nav-card { min-width: 155px; height: 74px; }
    .stat-strip { grid-template-columns: repeat(5, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>

<header class="top-bar">
  <div class="brand-cluster">
    <div class="crest-badge" id="gangCrestSlot">BC</div>
    <div class="title-block">
      <h1>Blades of the Crown</h1>

    </div>
  </div>
  <div class="top-actions">

    <button class="btn" onclick="openArtModal()">🖼️ Card Art</button>
    <button class="btn" onclick="exportHtml()">💾 Export HTML</button>
  </div>
</header>

<div class="workspace">
  <aside class="roster-rail">
    <div class="squad-tabs">
      <button class="squad-tab active" onclick="filterSquad('all', this)">All (10)</button>

    </div>
    <div class="fighter-list" id="fighterList"></div>
  </aside>

  <main class="dossier" id="dossierMain"></main>
</div>

<!-- Card Art & Local Override Modal -->
<div class="modal-backdrop" id="artModal" onclick="if(event.target===this) closeArtModal()">
  <div class="trump-modal">
    <div class="trump-art-frame">
      <img id="modalPortraitImg" alt="Fighter Portrait" style="display:none;">
      <div class="trump-art-gradient"></div>
      <div class="trump-caption">
        <h3 id="modalFighterName">Fighter</h3>
        <p id="modalPathHint">Auto-loading from images/...</p>
      </div>
    </div>
    <div class="modal-footer">
      <label class="btn" style="cursor:pointer;">
        📁 Override Photo
        <input type="file" accept="image/*" style="display:none;" onchange="handleManualUpload(event)">
      </label>
      <button class="btn" onclick="closeArtModal()">Close</button>
    </div>
  </div>
</div>

      { name: "Smoke Grenades", rngS:"-", rngL:'S x 3', accS:"-", accL:"-", str:"-", ap:"-", d:"-", traits:"Blast (5\"), Smoke, Grenade" }
    ],
    skills: [],
    gear: ["Flak Armour"],
    notes: "Deploys Smoke screen for Her Majesty & Nightshade advance."
  }
];

let activeId = "hermajesty";
let activeSquad = "all";
let calledStat = null;
const resolvedImages = {};

// Probe images/<id>.png -> .jpg -> .jpeg -> .webp automatically
function probeFighterImage(id, callback) {
  if (resolvedImages[id]) {
    callback(resolvedImages[id]);
    return;
  }
  const exts = ["png", "jpg", "jpeg", "webp"];
  let idx = 0;
  function tryNext() {
    if (idx >= exts.length) return;
    const url = `images/${id}.${exts[idx++]}`;
    const img = new Image();
    img.onload = () => {
      resolvedImages[id] = url;
      callback(url);
    };
    img.onerror = tryNext;
    img.src = url;
  }
  tryNext();
}

function initImages() {
  probeFighterImage("gangcrest", (url) => {
    const slot = document.getElementById("gangCrestSlot");
    slot.innerHTML = `<img src="${url}" alt="Gang Crest">`;
  });
  FIGHTERS.forEach(f => {
    probeFighterImage(f.id, () => {
      renderRoster();
      if (f.id === activeId) renderDossier();
    });
  });
}

function filterSquad(squad, btn) {
  activeSquad = squad;
  document.querySelectorAll(".squad-tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  renderRoster();
}

function renderRoster() {
  const list = document.getElementById("fighterList");
  const filtered = activeSquad === "all" ? FIGHTERS : FIGHTERS.filter(f => f.squad === activeSquad);
  list.innerHTML = filtered.map(f => {
    const bgStyle = resolvedImages[f.id] ? `background-image: url('${resolvedImages[f.id]}');` : "";
    return `
      <div class="nav-card ${f.id === activeId ? 'active' : ''}" onclick="selectFighter('${f.id}')">
        <div class="nav-card-bg" style="${bgStyle}"></div>
        <div class="nav-card-vignette"></div>
        <div class="nav-card-info">
          <div>
            <div class="nav-name">${f.name}</div>
            <div class="nav-role">${f.title.split("•")[0].trim()}</div>
          </div>
          <div class="nav-pts">${f.credits}c</div>
        </div>
      </div>
    `;
  }).join("");
}

function selectFighter(id) {
  activeId = id;
  calledStat = null;
  renderRoster();
  renderDossier();
}

function toggleStatCall(statKey) {
  calledStat = calledStat === statKey ? null : statKey;
  renderDossier();
}

function updateNotes(val) {
  const fighter = FIGHTERS.find(f => f.id === activeId);
  if (fighter) fighter.notes = val;
}

function renderDossier() {
  const f = FIGHTERS.find(item => item.id === activeId);
  if (!f) return;
  const main = document.getElementById("dossierMain");
  const artUrl = resolvedImages[f.id];
  const heroArtHtml = artUrl ? `<div class="hero-art-wash" style="background-image:url('${artUrl}');"></div>` : "";

  const statsHtml = Object.entries(f.stats).map(([k, v]) => `
    <div class="stat-cell ${calledStat === k ? 'called' : ''}" onclick="toggleStatCall('${k}')">
      <div class="stat-label">${k}</div>
      <div class="stat-val">${v}</div>
    </div>
  `).join("");

  const weaponsHtml = f.weapons.map(w => `
    <tr>
      <td><strong>${w.name}</strong></td>
      <td>${w.rngS} / ${w.rngL}</td>
      <td>${w.accS} / ${w.accL}</td>
      <td>${w.str}</td>
      <td>${w.ap}</td>
      <td>${w.d}</td>
      <td>${w.traits.split(",").map(t => `<span class="trait-tag">${t.trim()}</span>`).join("")}</td>
    </tr>
  `).join("");

  const skillsAndGear = [
    ...f.skills.map(s => `<span class="gear-chip" style="border-color:var(--gold-auric);color:var(--gold-bright);">★ ${s}</span>`),
    ...f.gear.map(g => `<span class="gear-chip">${g}</span>`)
  ].join("");

  main.innerHTML = `
    <div class="hero-banner">
      ${heroArtHtml}
      <div class="hero-gradient-overlay"></div>
      <div class="hero-content">
        <div class="hero-kicker">House Escher • Team ${f.squad.toUpperCase()} • ${f.xp} XP</div>
        <div class="hero-title">${f.name}</div>
        <div class="hero-sub">${f.title} — Tap any characteristic below to call a Top Trumps duel stat.</div>
      </div>
      <div class="hero-controls">
        <div class="credits-pill">${f.credits} Credits</div>
        <button class="btn" onclick="openArtModal()">🔍 View Full Portrait</button>
      </div>
    </div>

    <div class="stat-strip">${statsHtml}</div>

    <div class="section-card">
      <div class="section-header">
        <span class="section-title">N23 Armoury & Weapon Profiles</span>
        <span style="font-size:11px;color:var(--text-muted);">S / L Ranges & Accuracy</span>
      </div>
      <div style="overflow-x:auto;">
        <table class="weapons-table">
          <thead>
            <tr>
              <th>Weapon</th>
              <th>Rng (S/L)</th>
              <th>Acc (S/L)</th>
              <th>Str</th>
              <th>AP</th>
              <th>D</th>
              <th>Traits</th>
            </tr>
          </thead>
          <tbody>${weaponsHtml}</tbody>
        </table>
      </div>
    </div>

    <div class="two-col">
      <div class="section-card">
        <div class="section-header">
          <span class="section-title">Skills & Wargear</span>
        </div>
        <div class="tag-list">${skillsAndGear}</div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <span class="section-title">Tactical & Campaign Notes</span>
        </div>
        <textarea class="notes-box" oninput="updateNotes(this.value)">${f.notes}</textarea>
      </div>
    </div>
  `;
}

function openArtModal() {
  const f = FIGHTERS.find(item => item.id === activeId);
  const modal = document.getElementById("artModal");
  const img = document.getElementById("modalPortraitImg");
  document.getElementById("modalFighterName").textContent = f.name;
  if (resolvedImages[f.id]) {
    img.src = resolvedImages[f.id];
    img.style.display = "block";
    document.getElementById("modalPathHint").textContent = `Loaded: ${resolvedImages[f.id]}`;
  } else {
    img.style.display = "none";
    document.getElementById("modalPathHint").textContent = `Waiting for images/${f.id}.png (or .jpg/.webp)`;
  }
  modal.classList.add("open");
}

function closeArtModal() {
  document.getElementById("artModal").classList.remove("open");
}

function handleManualUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    resolvedImages[activeId] = e.target.result;
    openArtModal();
    renderRoster();
    renderDossier();
  };
  reader.readAsDataURL(file);
}

function exportHtml() {
  const blob = new Blob([document.documentElement.outerHTML], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
}

renderRoster();
renderDossier();
initImages();
</script>
